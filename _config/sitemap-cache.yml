---
Name: xd-sitemap-cache
After: '#googlesitemaproutes'
---
# Re-point the sitemap routes to the caching controller (loaded After the module routes so
# these rules win). The controller extends the module controller, so sub-sitemap routing
# (sitemap.xml/sitemap/$Class/$Page) is inherited; sitemap.xml.gz serves the gzip index.
SilverStripe\Control\Director:
  rules:
    'sitemap.xml.gz': 'XD\SitemapCache\Control\CachedGoogleSitemapController'
    'sitemap.xml': 'XD\SitemapCache\Control\CachedGoogleSitemapController'

# Declare the upstream static-cache config keys on GoogleSitemap and switch the cache on.
# These are the same keys the native CMS 6 (4.1+) feature reads, so the block carries over
# verbatim if the site later upgrades (then drop this module).
Wilr\GoogleSitemaps\GoogleSitemap:
  extensions:
    - XD\SitemapCache\Extensions\GoogleSitemapCacheExtension
  enable_static_cache: true
  enable_gzip: true
  static_cache_path: 'sitemaps'
  regenerate_time: 3600
